zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}
  include_path: null

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: smtp.qq.com
  smtp_port: 465
  sender_password: ${oc.env:SENDER_PASSWORD}

llm:
  api:
    key: ${oc.env:DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com
  generation_kwargs:
    model: deepseek-v4-pro
    max_tokens: 4096

source:
  arxiv:
    category: ["hep-th"]
    include_cross_list: true   # pick up hep-ph / math-ph cross-lists
    days_back: 3               # fetch last 3 arxiv working days per run

executor:
  debug: ${oc.env:DEBUG,null}
  source: ['arxiv']
  reranker: llm
  max_paper_num: 30  # hep-th daily volume is manageable

reranker:
  watchlist:
    authors:
      # Add or remove names freely — substring match, so "Witten" catches "Edward Witten"
      - Witten
      - Seiberg
      - Kapustin
      - Gaiotto
      - Cordova
      - Tachikawa
      - Komargodski
      - Shenker
      - Maldacena
    affiliations:
      # Searched in the raw LaTeX header of each paper
      - IAS Princeton
      - Perimeter Institute
      - CERN
  llm_reranker:
    research_interest: >
      I work on non-perturbative aspects of quantum field theory.
      My main interests include: exact results in 2D gauge theories (Schwinger model,
      bosonization, axial anomaly, confinement via photon mass generation), higher-form
      symmetries and symmetry topological field theories (SymTFT), 't Hooft anomaly
      matching, topological field theories in various dimensions, integrability in QFT,
      and string/M-theory compactifications that produce interesting low-dimensional
      effective field theories. I am also interested in lattice approaches to
      non-perturbative QFT when they connect to continuum exact results.
    batch_delay: 0.5

classic_recommender:
  enabled: true
  n_picks: 3
  pool_size: 80
  pool_mode: both            # pull from both watchlist authors AND broad hep-th
  min_citations: 150         # hep-th has inflation; 150+ is a reasonable bar
  max_paper_age_years: null  # no age limit — truly classic papers can be from any era
  inspire_timeout: 25

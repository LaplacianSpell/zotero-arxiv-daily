  llm_reranker:
    research_interest: >
      I work on non-perturbative QFT with three main threads.

      (1) Chiral gauge theories and lattice: bosonization/fermionization between
      compact bosons and Dirac fermions; Villain and modified-Villain Hamiltonians
      as exact lattice realizations of compact scalars; boundary CFT and anomaly
      inflow. Key references: Seifnashri-Shao-Seiberg on Villain Hamiltonians;
      Cheng-Seiberg (2023) on Lieb-Schultz-Mattis and t Hooft anomaly matching
      on the lattice. Goal: rigorous lattice boundary formulation of the 3450
      model reproducing the continuum IR reflection matrix; realize the
      non-invertible Z5 symmetry on the lattice with boundary.

      (2) Matrix models and holography: polarized IKKT model, matrix bootstrap,
      Monte Carlo at finite N, massive deformations of SYM in lower dimensions.
      Key references: Hartnoll-Liu (2406.11792, 2504.06481) on polarized IKKT
      and its first-order phase transition; Komatsu et al. (2410.18173,
      2411.18678) on backreacted geometries and localization; Lin-Hartnoll
      bootstrap via Schwinger-Dyson plus SDP.

      (3) Black hole information and holographic entanglement: information
      paradox, island formula, replica wormholes; semiclassical gravitational
      path integrals; holographic entanglement entropy in AdS/CFT and beyond;
      connections to quantum many-body physics and quantum information.
      Key researchers: Harlow, Penington, Maldacena, Shenker.
    score_model: deepseek-v4-flash
    batch_delay: 0.5

classic_recommender:
  enabled: true
  n_picks: 3
  pool_size: 50
  pool_mode: both
  min_citations: 200
  max_paper_age_years: null
  inspire_timeout: 25

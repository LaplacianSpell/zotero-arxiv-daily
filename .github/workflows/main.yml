name: Send emails (Mon + Thu)
on:
  workflow_dispatch:
  schedule:
    # Mon 22:00 UTC — covers Thu+Fri+Mon submissions (arxiv Mon batch = Fri papers)
    - cron: '0 22 * * 1'
    # Thu 22:00 UTC — covers Tue+Wed+Thu submissions
    - cron: '0 22 * * 4'

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit back sent_classics.json
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
            echo "Using CUSTOM_CONFIG variable:"
          else
            echo "Using committed config/custom.yaml:"
          fi
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py

      - name: Commit updated sent-classics state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/sent_classics.json
          if git diff --staged --quiet; then
            echo "No classic state changes to commit"
          else
            git commit -m "chore: update sent_classics state [skip ci]"
            git push
          fi

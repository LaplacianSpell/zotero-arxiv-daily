name: Test
on:
  workflow_dispatch:

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          DEBUG: "true"
        run: |
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
            echo "Using CUSTOM_CONFIG variable"
          else
            echo "Using committed config/custom.yaml"
          fi
          uv run src/zotero_arxiv_daily/main.py

      - name: Commit updated sent-classics state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/sent_classics.json state/last_run.json
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: update run state [skip ci]"
            git pull --rebase origin main
            git push
          fi
